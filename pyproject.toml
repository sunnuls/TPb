[project]
name = "hive-poker-bot"
version = "2.0.0"
description = "Multi-agent poker bot network with YOLO vision and collusion coordination"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
live = [
  "opencv-python",
  "pytesseract",
  "mss",
  "keyboard",
  "pyqt6",
  "ultralytics>=8.0.0",
  "easyocr",
]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.0.0",
]
simulation = [
  "websockets>=12.0",
  "torch>=2.0.0",
  "treys>=0.1.0",
  "matplotlib>=3.5.0",
  "tensorboard>=2.10.0",
  "scikit-learn>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["launcher/tests", "bridge", "sim_engine", "hive", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["launcher*", "bridge*", "sim_engine*", "hive*"]
exclude = ["templates*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
